name: Discover Sitemaps\n\non: workflow_dispatch:\n\njobs:\n  discover-sitemaps:\n    runs-on: ubuntu-latest:\n    steps:\n      - name: Checkout repository\n        uses: actions/checkout@v2\n\n      - name: Run discover sitemaps script\n        run: node scripts/discover-sitemaps.js\n\n      - name: Upload artifacts\n        uses: actions/upload-artifact@v2\n        with:\n          name: sitemap-artifacts\n          path: artifacts/url-inventory.json,artifacts/url-inventory.csv,artifacts/sitemap-counts.json\n