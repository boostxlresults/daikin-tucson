name: Discover Sitemaps

on: workflow_dispatch

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run sitemap discovery
        run: node scripts/discover-sitemaps.js

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sitemap-discovery-artifacts
          path: |
            artifacts/url-inventory.json
            artifacts/url-inventory.csv
            artifacts/sitemap-counts.json
          retention-days: 30